<!DOCTYPE html>
<html lang="es">
<head>
  
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <title>Escritorio Linux Mint Completo</title>
  <style>
    * { box-sizing: border-box; }
    body {
  margin: 0;
  height: 100vh;
  background: url("assets/background.jpg") no-repeat center center fixed;
  background-size: cover;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  overflow: hidden;
}
.taskbar {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 40px;
  background: rgba(20, 20, 20, 0.9);
  display: flex;
  align-items: center;
  padding: 0 10px;
  color: white;
  z-index: 10;
  gap: 10px; /* para separar el menú y los botones */
}
    .menu {
      background-color: rgba(0, 100, 0, 0.9);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .menu-panel {
      position: absolute;
      bottom: 45px;
      left: 10px;
      background-color: rgba(40, 40, 40, 0.95);
      color: white;
      padding: 10px;
      border-radius: 5px;
      width: 200px;
      display: none;
      box-shadow: 0 0 10px #000;
      z-index: 11;
    }
    .menu-panel div {
      padding: 5px;
      cursor: pointer;
    }
    .menu-panel div:hover {
      background-color: rgba(100, 255, 100, 0.2);
    }
    .app-icon {
  width: 60px;
  height: 60px;
  background-color: rgba(255,255,255,0.2);
  border-radius: 10px;
  margin: 20px;
  text-align: center;
  color: white;
  padding-top: 10px;
  cursor: grab;
  position: absolute; /* ← Importante para poder moverlos */
}
    .desktop {
      position: relative;
      padding: 20px;
    }
    .clock {
      font-size: 1rem;
    }
    .window {
  position: absolute;
  top: 100px;
  left: 100px;
  width: 500px;
  height: 300px;
  background-color: #2b2b2b;      /* gris grafito */
  border-radius: 8px;
  color: #93d18f;                 /* verde menta suave */
  display: none;
  flex-direction: column;
  box-shadow: 0 0 10px #0008;     /* sombra ligera */
  z-index: 5;
}
.close-icon {
  width: 18px;
  height: 18px;
  cursor: pointer;
}
    .window-header {
      background-color: #292929;
      padding: 5px 10px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      color: #e3e3e3;
    }
    .window-body {
  flex: 1;
  overflow: auto;
  padding: 10px;
}
    .close-btn {
      color: red;
      cursor: pointer;
    }
    .terminal {
  background-color: #1e1e1e;
  color: #93d18f;
  padding: 10px;
  font-family: monospace;
  height: 300px;
  overflow-y: auto;
}

#terminal-input {
  width: 100%;
  background: transparent;
  border: none;
  color: #0f0;
  font-family: monospace;
  font-size: 1em;
  outline: none;
}
    .calc-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }
    .calc-buttons button {
      padding: 10px;
      font-size: 1rem;
      background-color: #3c3c3c;
      color: #93d18f;
      border: none;
      cursor: pointer;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .calendar-grid div {
      padding: 5px;
      background-color: #222;
      color: #93d18f;
    }
    .start-icon {
  height: 28px;
  width: 28px;
  object-fit: contain;
  display: block;
}
#terminalOutput {
  max-height: 100%;
  overflow-y: auto;
  white-space: pre-wrap; /* permite saltos de línea correctos */
  word-break: break-word;
  font-family: monospace;
}
.resize-handle {
  position: absolute;
  width: 15px;
  height: 15px;
  right: 0;
  bottom: 0;
  cursor: nwse-resize;
  background: transparent;
}
.htop-body {
  background-color: #1e1e1e;
  color: #00ff00;
  font-family: monospace;
  font-size: 12px;
  padding: 10px;
  overflow-y: auto;
  height: calc(100% - 40px);
  white-space: pre;
  border-top: 1px solid #444;
}

.htop-header {
  color: #00ffff;
  font-weight: bold;
}

.htop-row {
  border-bottom: 1px dotted #444;
  padding: 2px 0;
}
.taskbar-btn {
  background: transparent;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
  .taskbar-btn:hover span { color: #aaffaa; }
  </style>
</head>
<body>

<div class="desktop">
  <div class="app-icon" onclick="renderWindow('musicPlayer'); openWindow('musicPlayerWindow')" style="top: 500px; left: 40px;">
    🎵<br>Música
  </div>
  <div class="app-icon" onclick="renderWindow('notepad'); openWindow('notepadWindow')" style="top: 660px; left: 40px;">
    📝<br>Notas
  </div>
  <div class="app-icon" onclick="renderWindow('fileManager'); openWindow('fileManagerWindow')" style="top: 580px; left: 40px;">📁<br>Archivos</div>
  <div class="app-icon" onclick="renderWindow('taskManager'); openWindow('taskManagerWindow')" style="top: 360px; left: 40px;">🧠<br>TaskMgr</div>
  <div class="app-icon" onclick="renderWindow('terminal'); openWindow('terminalWindow')" style="top: 40px; left: 40px;">🖥️<br>Terminal</div>
<div class="app-icon" onclick="renderWindow('calc'); openWindow('calcWindow')" style="top: 200px; left: 40px;">🧮<br>Calculadora</div>
<div class="app-icon" onclick="renderWindow('calendar'); openWindow('calendarWindow')" style="top: 280px; left: 40px;">📅<br>Calendario</div>
</div>

<div class="taskbar">
  <div class="menu" onclick="toggleMenu()">
    <img src="assets/start_button.png" alt="Inicio" class="start-icon">
  </div>

  <!-- Botones a la derecha del menú -->
  <div id="taskButtonsContainer" style="display: flex; gap: 5px;"></div>

  <div class="clock" id="clock"></div>
</div>

<div class="menu-panel" id="menuPanel">
  <div onclick="openFileManager()">📁 Archivos</div>
  <div onclick="openMusicPlayer()">🎵 Música</div>
  <div onclick="openTaskManager()">🧠 TaskMgr</div>
  <div onclick="renderWindow('terminal'); openWindow('terminalWindow')">🖥️ Terminal</div>
  <div onclick="renderWindow('notepad'); openWindow('notepadWindow')">📝 Bloc de Notas</div>
  <div onclick="renderWindow('calc'); openWindow('calcWindow')">🧮 Calculadora</div>
  <div onclick="renderWindow('calendar'); openWindow('calendarWindow')">📅 Calendario</div>
  <hr style="margin: 10px 0; border-color: #555;">
  <div onclick="cerrarSesion()">🔒 Cerrar sesión</div>
  <div onclick="reiniciarSistema()">🔄 Reiniciar</div>
  <div onclick="apagarSistema()">⏻ Apagar</div>
</div>


<script>
function toggleMenu() {
  const panel = document.getElementById("menuPanel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
}
function openWindow(id) {
  document.getElementById(id).style.display = "flex";
  if (id === "terminalWindow") setTimeout(() => document.getElementById("terminalInput").focus(), 100);
  updateTaskbarButtons();
}
function closeWindow(id) {
  document.getElementById(id).style.display = "none";
  updateTaskbarButtons();
}
function updateClock() {
  const now = new Date();
  document.getElementById('clock').innerText = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// Terminal

// Calculadora
let calcValue = "";
function appendCalc(val) {
  calcValue += val;
  document.getElementById("calcDisplay").value = calcValue;
}
function calculateCalc() {
  try {
    calcValue = eval(calcValue).toString();
  } catch {
    calcValue = "Error";
  }
  document.getElementById("calcDisplay").value = calcValue;
}
function clearCalc() {
  calcValue = "";
  document.getElementById("calcDisplay").value = "";
}




// Funcionalidad para hacer arrastrables las ventanas
document.querySelectorAll('.window').forEach(windowEl => {
  const header = windowEl.querySelector('.window-header');
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  header.style.cursor = "move";

  header.addEventListener('mousedown', (e) => {
    isDragging = true;
    offsetX = e.clientX - windowEl.offsetLeft;
    offsetY = e.clientY - windowEl.offsetTop;
    windowEl.style.zIndex = 100;
    e.preventDefault(); // prevenir selección de texto
  });

  

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    const newLeft = e.clientX - offsetX;
    const newTop = e.clientY - offsetY;

    const maxLeft = window.innerWidth - windowEl.offsetWidth;
    const maxTop = window.innerHeight - windowEl.offsetHeight;

    // Limitar los bordes para que no se salgan
    windowEl.style.left = Math.max(0, Math.min(newLeft, maxLeft)) + 'px';
    windowEl.style.top = Math.max(0, Math.min(newTop, maxTop)) + 'px';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });
});

// Funcionalidad para arrastrar íconos del escritorio
document.querySelectorAll('.app-icon').forEach(icon => {
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;

  icon.addEventListener('mousedown', (e) => {
    isDragging = true;
    offsetX = e.clientX - icon.offsetLeft;
    offsetY = e.clientY - icon.offsetTop;
    icon.style.zIndex = 99;
    icon.style.cursor = "grabbing";
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;

    const newLeft = e.clientX - offsetX;
    const newTop = e.clientY - offsetY;

    const maxLeft = window.innerWidth - icon.offsetWidth;
    const maxTop = window.innerHeight - icon.offsetHeight - 50; // dejar espacio para la barra de tareas

    icon.style.left = Math.max(0, Math.min(newLeft, maxLeft)) + 'px';
    icon.style.top = Math.max(0, Math.min(newTop, maxTop)) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      icon.style.cursor = "grab";
    }
  });
});

// Funcionalidad para redimensionar ventanas
document.querySelectorAll('.resize-handle').forEach(handle => {
  const windowEl = handle.parentElement;
  let isResizing = false;

  handle.addEventListener('mousedown', (e) => {
    isResizing = true;
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;

    const newWidth = e.clientX - windowEl.offsetLeft;
    const newHeight = e.clientY - windowEl.offsetTop;
    
    windowEl.style.width = Math.max(200, newWidth) + 'px';
    windowEl.style.height = Math.max(150, newHeight) + 'px';
  });

  document.addEventListener('mouseup', () => {
    isResizing = false;
  });
});

function updateTaskbarButtons() {
  const container = document.getElementById('taskButtonsContainer');
  container.innerHTML = '';

  const windows = document.querySelectorAll('.window');
  windows.forEach(win => {
    const id = win.id;
    const icon = {
      terminalWindow: "🖥️",
      notepadWindow: "📝",
      calcWindow: "🧮",
      calendarWindow: "📅",
      taskManagerWindow: "🧠",
      musicPlayerWindow: "🎵",
      fileManagerWindow: "📁"
    }[id] || "📦";

    if (win.style.display !== 'none') {
      const btn = document.createElement('button');
      btn.className = 'taskbar-btn';
      btn.innerHTML = `<span>${icon}</span>`;
      btn.title = win.querySelector('.window-header span')?.textContent || id;
      // Removed redundant inline styles for taskbar-btn, only .background allowed if needed
      btn.onclick = () => {
        win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        updateTaskbarButtons();
      };

      container.appendChild(btn);
    }
  });
}

</script>
<script src="apps/notepad.js"></script>
<script src="apps/filemanager.js"></script>
<script src="apps/musica.js"></script>
<script src="apps/taskmanager.js"></script>
<script src="apps/terminal.js"></script>
<script src="apps/ventanas.js"></script>
<script src="apps/calendario.js"></script>

<script>
  function cerrarSesion() {
    window.location.href = "index.html"; // o la ruta a tu login si es otra
  }
  
  function reiniciarSistema() {
    location.reload();
  }
  
  function apagarSistema() {
    const confirmacion = confirm("¿Seguro que deseas apagar?");
    if (confirmacion) {
      document.body.innerHTML = `
        <div style="background:black; color:white; height:100vh; display:flex; align-items:center; justify-content:center; font-size:2em;">
          📴 El sistema se ha apagado.
        </div>`;
    }
  }
  </script>
</body>
</html>
